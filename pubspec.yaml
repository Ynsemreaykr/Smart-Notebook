name: smart_notebook
description: "Smart Notebook, Scanner & Calendar App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.6
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase & Google Sign In
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.1.0



  # PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # Sharing
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Calendar UI
  table_calendar: ^3.1.3

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Image Picker
  image_picker: ^1.1.2

  # File Picker (cihaz hafızasından PDF seçimi için)
  file_picker: ^8.1.4

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  flutter_drawing_board: ^1.0.1+2
  receive_sharing_intent: ^1.8.1
  device_info_plus: ^10.1.0
  home_widget: 0.7.0
  wakelock_plus: ^1.5.2
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
